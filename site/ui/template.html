<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; base-uri 'none'; form-action 'none'">
  <meta name="description" content="爱衣橱，把自己的衣服穿成自己的风格。整理单品、搭配试穿、记录每一天。">
  <title>爱衣橱 · Your everyday look</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3.5 10 8.5-7 8.5 7v10a1 1 0 0 1-1 1h-5.3v-7h-4.4v7H4.5a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M3.5 7h4L9 4.5h6L16.5 7h4v13h-17Z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="icon-wardrobe" viewBox="0 0 24 24"><path d="M5 4h14l3 13v3H2v-3L5 4Z"/><path d="M2.5 14H8l2 3h4l2-3h5.5"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h.01m4 0h.01m4 0h.01m-8 4h.01m4 0h.01m4 0h.01"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.2 4.8a5.4 5.4 0 0 0-7.6 0l-.6.6-.6-.6a5.4 5.4 0 0 0-7.6 7.6L12 20.7l8.2-8.3a5.4 5.4 0 0 0 0-7.6Z"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M12 15V2m-5 5 5-5 5 5M7 9H4v12h16V9h-3"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="icon-shirt" viewBox="0 0 24 24"><path d="m8 3-5 3-2 4.5 5 2V21h12v-8.5l5-2L21 6l-5-3c-.5 3-7.5 3-8 0Z"/></symbol>
    <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M18.4 5.6A9 9 0 1 0 21 12M18 2v5h5"/></symbol>
    <symbol id="icon-rotation" viewBox="0 0 24 24"><path d="M8 17c-3.6-.9-6-2.7-6-5 0-3.1 4.5-5.5 10-5.5S22 8.9 22 12c0 2.4-2.6 4.3-6.4 5.1M8 13v4H4m12 0h-4"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="icon-images" viewBox="0 0 24 24"><rect x="6" y="6" width="16" height="16" rx="3"/><path d="M17 3H5a2 2 0 0 0-2 2v12m3 1 4-4 3 3 4-6 5 7"/><circle cx="11" cy="11" r="1"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-help" viewBox="0 0 24 24"><path d="M8.2 7.5a4 4 0 0 1 7.6 1.7c0 2.5-3.8 2.7-3.8 5.3M12 19v.1"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m5 19 9-9m-7 7 3 3M14 3v4m-2-2h4M20 10v4m-2-2h4M5 5v4M3 7h4"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M3 6h18M3 18h18"/><circle cx="8" cy="6" r="3"/><circle cx="16" cy="18" r="3"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
  </defs></svg>
  <div id="app">
    <header id="app-header">
      <button class="brand" data-view="home" type="button" aria-label="爱衣橱，回到首页">爱衣橱<span>°</span></button>
      <div class="header-actions">
        <button id="calendar-open" class="icon-button" type="button" aria-label="穿搭日历"><svg class="icon"><use href="#icon-calendar"/></svg></button>
        <button id="menu-open" class="icon-button" type="button" aria-label="菜单"><svg class="icon"><use href="#icon-menu"/></svg></button>
      </div>
    </header>
    <main>
      <section id="home-view" class="screen active" data-screen="home" aria-label="我的穿搭">
        <div id="model-stage" class="model-stage">
          <div id="season-word" aria-hidden="true">SUMMER</div>
          <img id="look-poster" alt="当前穿搭全身效果">
          <video id="look-video" playsinline muted loop preload="metadata" hidden></video>
          <button id="look-prev" class="icon-button look-arrow" type="button" aria-label="上一套穿搭"><svg class="icon"><use href="#icon-left"/></svg></button>
          <button id="look-next" class="icon-button look-arrow" type="button" aria-label="下一套穿搭"><svg class="icon"><use href="#icon-right"/></svg></button>
          <span id="rotation-hint" hidden>Drag to rotate</span>
          <button id="play-look" class="icon-button" type="button" aria-label="播放或暂停转身" hidden><svg class="icon"><use href="#icon-play"/></svg></button>
        </div>
        <section id="look-sheet" aria-label="当前穿搭详情">
          <button id="sheet-toggle" type="button" aria-label="展开或收起穿搭单品" aria-expanded="false"><span></span></button>
          <div class="look-meta"><div id="look-palette" aria-label="搭配色彩"></div><button id="look-date" type="button"><svg class="icon"><use href="#icon-calendar"/></svg><span>Today</span></button></div>
          <div id="look-pieces" aria-label="本套穿搭的单品"></div>
          <div id="look-actions">
            <button id="create-rotation" class="button primary rotation-button" type="button"><svg class="icon"><use href="#icon-rotation"/></svg><span>Create 360°</span></button>
            <button id="share-look" class="icon-button" type="button" aria-label="分享当前穿搭"><svg class="icon"><use href="#icon-share"/></svg></button>
            <button id="delete-look" class="icon-button" type="button" aria-label="删除当前穿搭"><svg class="icon"><use href="#icon-trash"/></svg></button>
          </div>
        </section>
      </section>
      <section id="wardrobe-view" class="screen" data-screen="wardrobe" aria-label="我的衣橱">
        <header id="wardrobe-toolbar"><h1>My wardrobe</h1><div><label class="wardrobe-search-label"><svg class="icon"><use href="#icon-search"/></svg><input id="wardrobe-search" type="search" placeholder="Search pieces" aria-label="搜索衣物"></label><button id="wardrobe-add" class="icon-button" type="button" aria-label="添加衣物"><svg class="icon"><use href="#icon-plus"/></svg></button></div></header>
        <div id="wardrobe-shelves"></div>
      </section>
      <section id="choose-view" class="screen" data-screen="choose" aria-label="选择试穿人物">
        <div class="workflow-topbar"><button id="choose-close" class="icon-button" type="button" aria-label="关闭试穿"><svg class="icon"><use href="#icon-close"/></svg></button><button id="choose-help" class="icon-button" type="button" aria-label="人物照片指引"><svg class="icon"><use href="#icon-help"/></svg></button></div>
        <div id="choose-stage"><div id="photo-guide" aria-hidden="true"><svg viewBox="0 0 240 420"><rect x="28" y="8" width="184" height="404" rx="92"/><circle cx="120" cy="91" r="31"/><path d="M87 143q33-24 66 0l14 110M87 143 73 253m21-71 2 91-10 104m58-195-2 91 12 104m-58-104h46"/></svg></div><img id="choose-photo" alt="待试穿的人物照片" hidden><button id="change-photo" class="icon-button" type="button" aria-label="更换人物照片" hidden><svg class="icon"><use href="#icon-rotate"/></svg></button></div>
        <div class="choose-bottom"><div id="choose-selected" aria-label="已选试穿衣物"></div><h1 id="choose-caption">Choose a full-body photo</h1><button id="choose-photo-button" class="button primary" type="button"><svg class="icon"><use href="#icon-images"/></svg><span>Choose photo</span></button><button id="generate-look" class="button primary" type="button" hidden>Generate look</button></div>
      </section>
      <section id="processing-view" class="screen" data-screen="processing" aria-label="正在生成试穿">
        <div class="workflow-topbar"><button id="processing-close" class="icon-button" type="button" aria-label="收起生成任务"><svg class="icon"><use href="#icon-close"/></svg></button></div>
        <div class="processing-content"><div class="processing-card"><img id="processing-photo" alt="正在试穿的人物"><div class="processing-scan" aria-hidden="true"></div><span id="processing-orbit" aria-hidden="true"></span></div><div id="processing-label" role="status"><svg class="icon"><use href="#icon-spark"/></svg><span>Styling your selected pieces</span></div><p id="processing-note">Your new look is on its way.</p><div id="processing-pieces" aria-label="正在试穿的单品"></div></div>
      </section>
      <section id="result-view" class="screen" data-screen="result" aria-label="试穿效果">
        <div class="workflow-topbar"><button id="result-close" class="icon-button" type="button" aria-label="关闭试穿效果"><svg class="icon"><use href="#icon-close"/></svg></button></div>
        <div class="result-stage"><div class="result-season" aria-hidden="true">SUMMER</div><img id="result-photo" alt="生成的真人试穿效果"></div>
        <div class="result-actions"><button id="result-favorite" class="icon-button" type="button" aria-label="收藏试穿效果" aria-pressed="false"><svg class="icon"><use href="#icon-heart"/></svg></button><button id="result-download" class="icon-button" type="button" aria-label="下载试穿效果"><svg class="icon"><use href="#icon-download"/></svg></button><button id="result-share" class="icon-button" type="button" aria-label="分享试穿效果"><svg class="icon"><use href="#icon-share"/></svg></button></div><button id="result-done" class="button secondary" type="button">Back to my looks</button>
      </section>
    </main>
    <aside id="selection-tray" hidden aria-label="已选衣物"><button id="tray-toggle" type="button" aria-expanded="false"><svg class="icon"><use href="#icon-shirt"/></svg><span id="selected-count">0</span></button><div id="tray-content"><div id="selected-pieces"></div><button id="dress-up" class="button" type="button">Dress up</button></div></aside>
    <nav id="bottom-nav" aria-label="主导航"><button class="active" data-view="home" type="button" aria-label="穿搭首页" aria-current="page"><svg class="icon"><use href="#icon-home"/></svg></button><button class="camera-nav" data-view="camera" type="button" aria-label="拍照或添加照片"><svg class="icon"><use href="#icon-camera"/></svg></button><button data-view="wardrobe" type="button" aria-label="我的衣橱"><svg class="icon"><use href="#icon-wardrobe"/></svg></button></nav>
  </div>
  <dialog id="calendar-dialog" aria-label="穿搭日历"></dialog>
  <dialog id="menu-dialog" aria-label="我的爱衣橱"></dialog>
  <dialog id="gallery-dialog" aria-label="选择人物照片"></dialog>
  <dialog id="recognition-dialog" aria-label="衣物识别入库"></dialog>
  <dialog id="settings-dialog" aria-label="AI 服务设置"></dialog>
  <dialog id="rotation-dialog" aria-label="360° 转身"></dialog>
  <dialog id="confirm-dialog" aria-label="确认操作"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <button id="task-dock" type="button" hidden aria-label="查看当前生成任务"></button>
  <input id="model-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="garment-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="rotation-file" type="file" accept="video/mp4,video/quicktime,video/webm" hidden>
  <script id="seed-data" type="application/json">__DATA__</script>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
